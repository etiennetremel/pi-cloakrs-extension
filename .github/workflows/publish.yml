name: Release and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-and-publish
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Release tag must be vMAJOR.MINOR.PATCH (no prerelease or leading zeros)'
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release.outputs.tag_name }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11

      - name: Install package and test host
        run: |
          npm ci
          npm install --prefix "$RUNNER_TEMP/pi" --no-audit --no-fund @earendil-works/pi-coding-agent@1.1.0

      - name: Verify committed package version matches release tag
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const version = process.env.RELEASE_TAG.slice(1);
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          assert.equal(pkg.version, version);
          assert.equal(lock.version, version);
          assert.equal(lock.packages[''].version, version);
          NODE

      - name: Test including clean package installation
        env:
          PI_TEST_BINARY: ${{ runner.temp }}/pi/node_modules/.bin/pi
          PI_CLOAKRS_TEST_INSTALL: '1'
        run: npm test

      - name: Publish with trusted publishing
        run: npm publish --access public --provenance
